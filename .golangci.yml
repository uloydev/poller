version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - revive
    - gosec
    - nilerr
    - bodyclose
    - wastedassign
    - gocritic
    - testifylint
    - godot
  settings:
    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: error-strings
    gocritic:
      enabled-tags:
        - diagnostic
        - style
    gosec:
      excludes:
        - G115

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

run:
  timeout: 5m
